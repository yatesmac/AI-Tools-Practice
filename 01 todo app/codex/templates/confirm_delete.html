{% extends "base.html" %}
{% block content %}
<section class="card">
    <div class="card-header">
        <div>
            <p class="eyebrow">Delete todo</p>
            <h2>Remove "{{ todo.title }}"?</h2>
        </div>
    </div>
    <p class="muted">This action cannot be undone.</p>
    <form method="post" class="confirm-actions">
        {% csrf_token %}
        <a href="{% url 'home' %}" class="ghost">Cancel</a>
        <button type="submit" class="chip danger">Delete</button>
    </form>
</section>
{% endblock %}
