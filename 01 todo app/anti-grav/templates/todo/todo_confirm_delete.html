{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white shadow-md rounded-lg overflow-hidden mt-10">
    <div class="p-6 text-center">
        <h2 class="text-2xl font-bold mb-4 text-red-600">Delete Task?</h2>
        <p class="text-gray-700 mb-6">Are you sure you want to delete "<strong>{{ todo.title }}</strong>"? This action
            cannot be undone.</p>

        <form method="post">
            {% csrf_token %}
            <div class="flex justify-center space-x-4">
                <button type="submit"
                    class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                    Confirm Delete
                </button>
                <a href="{% url 'todo_list' %}"
                    class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
