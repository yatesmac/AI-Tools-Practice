{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto bg-white shadow-md rounded-lg overflow-hidden mt-10">
    <div class="p-6">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">{{ title }}</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="id_title">Title</label>
                <input type="text" name="title" id="id_title" value="{{ form.title.value|default:'' }}"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="id_description">Description</label>
                <textarea name="description" id="id_description"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    rows="3">{{ form.description.value|default:'' }}</textarea>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="id_due_date">Due Date</label>
                {{ form.due_date }}
                <!-- Note: The widget in forms.py handles the type="date" attribute -->
            </div>
            <div class="mb-6">
                <label class="flex items-center">
                    <input type="checkbox" name="is_completed" id="id_is_completed" {% if form.is_completed.value
                        %}checked{% endif %} class="form-checkbox h-5 w-5 text-blue-600">
                    <span class="ml-2 text-gray-700">Completed</span>
                </label>
            </div>
            <div class="flex items-center justify-between">
                <button
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                    type="submit">
                    Save
                </button>
                <a href="{% url 'todo_list' %}"
                    class="inline-block align-baseline font-bold text-sm text-blue-600 hover:text-blue-800">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
